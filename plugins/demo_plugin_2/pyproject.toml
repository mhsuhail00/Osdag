#    ├── data/
#    └── utils/

# if 
#├── pyproject.toml
#└── demo_plugin_2/
#    ├── __init__.py
#    ├── demo_plugin.py
#    ├── data/
#    └── utils/
# then import using demo_plugin_2 and listed as demo_plugin_1 change name
